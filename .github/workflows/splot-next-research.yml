name: Splot Next research checks

on:
  push:
    branches:
      - research/material-part-lifecycle-2026-10-20
    paths:
      - 'src/next/**'
      - 'build-next.py'
      - 'tests/research/**'
      - 'tests/verify-next.sh'
      - 'tests/check-next-bundle.mjs'
      - 'tests/browser-next-wasm.mjs'
      - 'tests/browser-next-creator-storm.mjs'
      - 'tests/browser-next-perf.mjs'
      - '.github/workflows/splot-next-research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: splot-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-next:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check standalone and Next contracts
        run: bash tests/verify-next.sh
      - name: Install browser automation client
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Run actual Box3D WASM in headless Chrome
        run: |
          command -v google-chrome || command -v chromium
          node tests/browser-next-wasm.mjs
      - name: Research dense creator-pressure Box3D A/B
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[storm]')
        run: node tests/browser-next-creator-storm.mjs
      - name: Archive dense creator visual evidence
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[storm]')
        uses: actions/upload-artifact@v4
        with:
          name: splot-creator-pressure
          path: /tmp/splot-creator-storm-dense-solver.png
          if-no-files-found: error
          retention-days: 3
      - name: Research CPU and rAF performance A/B
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[profile]')
        run: node tests/browser-next-perf.mjs
      - name: Archive temporary synthetic camera visual evidence
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual]')
        uses: actions/upload-artifact@v4
        with:
          name: splot-synthetic-camera-views
          path: /tmp/splot-orbit-*.png
          if-no-files-found: error
          retention-days: 3
