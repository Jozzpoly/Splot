<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Splot / Box3D parity feasibility (R&D)</title><style>body{background:#102025;color:#e1e8df;font:15px/1.5 system-ui;max-width:900px;margin:42px auto;padding:0 20px}pre{white-space:pre-wrap;overflow:auto;border:1px solid #536568;border-radius:12px;padding:16px}small{color:#b5c3b9}</style><h1>SPLOT / Box3D feasibility</h1><p>Badawcza próba tej samej pochylni i podestu. Nie jest to nowa gra ani benchmark czasu FPS. Używa API Box3D 0.1.1 znanego z projektu Character Controller.</p><pre id="out">Ładowanie Box3D...</pre><small>Wykonywanie w przeglądarce; moduł WebAssembly ładowany z CDN.</small><script type="module">
const out=document.querySelector('#out'),log=(name,status,detail='')=>{out.textContent+=(out.textContent.includes('Ładowanie')?'\n':'')+status+' / '+name+(detail?' / '+detail:'')+'\n'};
try{
 const imported=await import('https://esm.sh/box3d.js@0.1.1/inline?bundle');
 const creator=imported.default; if(typeof creator!=='function')throw Error('Not a callable Box3D module initializer');
 const b3=await creator(), def=b3.b3DefaultWorldDef();def.gravity=[0,-9.81,0];const world=b3.b3CreateWorld(def);
 log('WASM Box3D','PASS','module initialized');
 const dt=1/60;
 const pos=[0,0,0];
 function makeBox(id,type,p,half,rotation=[0,0,0,1]){
  const bd=b3.b3DefaultBodyDef();bd.position=p;bd.rotation=rotation;
  if(type==='dynamic')bd.type=b3.b3BodyType.b3_dynamicBody;
  const body=b3.b3CreateBody(world,bd),sd=b3.b3DefaultShapeDef();sd.density=type==='dynamic'?1:0;sd.baseMaterial.friction=.75;
  b3.b3CreateBoxShape(body,sd,half[0],half[1],half[2]);return body;
 }
 makeBox('ground','static',[21,-.35,13],[21,.35,20]);
 const theta=Math.atan2(2.4,5), q=[0,0,Math.sin(theta/2),Math.cos(theta/2)];
 makeBox('ramp','static',[15.5,1.09,13],[Math.hypot(5,2.4)/2,.12,1.15],q);
 const deck=makeBox('deck','static',[23,2.25,13],[5,.15,2]);
 let box=makeBox('crate','dynamic',[23,4.6,13],[.43,.43,.43]);
 for(let i=0;i<180;i++)b3.b3World_Step(world,dt,4);
 b3.b3Body_GetPosition(pos,box);
 log('dynamic crate settles on deck',Math.abs(pos[1]-2.83)<.25?'PASS':'FAIL','height='+pos[1].toFixed(3));
 b3.b3DestroyBody(deck);
 for(let i=0;i<180;i++)b3.b3World_Step(world,dt,4);
 b3.b3Body_GetPosition(pos,box);
 log('removing platform makes crate fall',Math.abs(pos[1]-.43)<.25?'PASS':'FAIL','height='+pos[1].toFixed(3));
 // Reset the elevated structure before the character test, do not share
 // mutation from the previous scenario.
 makeBox('deck2','static',[23,2.25,13],[5,.15,2]);
 const capsule={center1:[0,-.5,0],center2:[0,.5,0],radius:.28},filter=b3.b3DefaultQueryFilter();
 const scratch=b3.createPlaneResult(),onRamp=new URLSearchParams(location.search).get('spawn')==='onramp',position=onRamp?[14,1.26,13]:[12,.78,13],target=[0,0,0];let vx=0,vy=0,maxY=position[1],blocked=0,trace=[];
 for(let i=0;i<280;i++){
  const intended=.065;const desiredX=position[0]+intended;
  vy=Math.max(-.23,vy-.009);
  const desiredY=position[1]+vy;
  target[0]=desiredX;target[1]=desiredY;target[2]=13;
  let lastPlanes=[];
  for(let j=0;j<5;j++){
   let planes=[];
   b3.b3World_CollideMover(world,position,capsule,filter,(shapeId,buf)=>{
    const count=b3.getNumPlaneResults(buf);
    for(let k=0;k<count;k++){
     b3.getPlaneResultAt(scratch,buf,k);
     planes.push({plane:{normal:[...scratch.plane.normal],offset:scratch.plane.offset},pushLimit:3.4e38,push:0,clipVelocity:true});
    }
    return true;
   });
   const deltaTarget=[target[0]-position[0],target[1]-position[1],target[2]-position[2]];
   const result=b3.b3SolvePlanes(deltaTarget,planes);
   const fraction=b3.b3World_CastMover(world,position,capsule,result.delta,filter,()=>true);
   for(let k=0;k<3;k++)position[k]+=result.delta[k]*fraction;
   lastPlanes=planes;
   if(Math.hypot(...result.delta)<.002)break;
  }
  if(Math.abs(position[0]-desiredX)>.045)blocked++;
  vy=b3.b3ClipVector([intended,vy,0],lastPlanes)[1];
  maxY=Math.max(maxY,position[1]);
  if(i%40===0)trace.push(i+':'+position[0].toFixed(2)+','+position[1].toFixed(2));
  b3.b3World_Step(world,dt,4);
 }
 log('Box3D capsule ramp-to-deck route '+(onRamp?'[on-ramp spawn]':'[ground spawn]'),(position[0]>22&&maxY>3.0&&position[1]>3)?'PASS':'FAIL','x='+position[0].toFixed(3)+', y='+position[1].toFixed(3)+', maxY='+maxY.toFixed(3)+', blocked='+blocked);
 log('trajectory evidence','INFO',trace.join(' | '));
 out.dataset.state='done';b3.b3DestroyWorld(world);
}catch(e){log('Box3D feasibility','ERROR',String(e?.stack||e));out.dataset.state='error';}
</script></html>
