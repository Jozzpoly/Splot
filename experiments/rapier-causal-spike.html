<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Splot — Rapier causal spike (research only)</title>
<style>body{background:#102024;color:#dce8e4;font:15px/1.6 system-ui;max-width:850px;margin:48px auto;padding:0 24px}pre{white-space:pre-wrap;border:1px solid #4d6568;padding:18px;border-radius:9px}small{color:#acc3bc}</style></head>
<body><h1>Splot / physics-only challenger</h1><p>Wąski pomiar fizyki, <strong>nie nowa gra</strong>, nie test kamery i nie wybór silnika. Tylko grawitacja, kontakty i zmiana sceny.</p>
<pre id="result" aria-live="polite">Ładowanie Rapier 0.21.0…</pre><small>CDN ESM i WebAssembly, uruchamiane wyłącznie na żądanie w przeglądarce. Żadne dane użytkownika nie są wysyłane do aplikacji.</small>
<script type="module">
const output=document.getElementById('result'),lines=[],t0=performance.now();
const log=(name,ok,more='')=>{lines.push((ok?'PASS':'FAIL')+' / '+name+(more?' / '+more:''));output.textContent=lines.join('\n')};
const approx=(a,b,tol)=>Math.abs(a-b)<=tol;
try{
 const m=await import('https://esm.sh/@dimforge/rapier3d-compat@0.21.0?bundle');
 const R=m.default||m;
 if(typeof R.init==='function')await R.init();
 const world=new R.World({x:0,y:0,z:-9.81});
 world.timestep=1/60;
 const fixed=(x,y,z,hx,hy,hz,rot=null)=>{
  const desc=R.RigidBodyDesc.fixed().setTranslation(x,y,z);
  if(rot)desc.setRotation(rot);
  const body=world.createRigidBody(desc);
  world.createCollider(R.ColliderDesc.cuboid(hx,hy,hz),body);
  return body;
 };
 fixed(21,16,-.35,21,16,.35);
 const theta=Math.atan2(2.4,5), q={x:0,y:-Math.sin(theta/2),z:0,w:Math.cos(theta/2)};
 fixed(15.5,13,1.09,Math.hypot(5,2.4)/2,1.15,.12,q);
 const deck=fixed(23,13,2.25,5,2,.15);
 const crate=world.createRigidBody(R.RigidBodyDesc.dynamic().setTranslation(23,13,4.6).setCanSleep(false));
 world.createCollider(R.ColliderDesc.cuboid(.43,.43,.43),crate);
 for(let i=0;i<180;i++)world.step();
 const z1=crate.translation().z;
 log('skrzynia ląduje na statycznym podeście',approx(z1,2.83,.22),'z='+z1.toFixed(3));
 world.removeRigidBody(deck);
 for(let i=0;i<180;i++)world.step();
 const z2=crate.translation().z;
 log('usunięcie podpory ma konsekwencję fizyczną',z2<.7&&z2>.25,'z='+z2.toFixed(3));
 const intruder=world.createRigidBody(R.RigidBodyDesc.dynamic().setTranslation(9,8,.8).setCanSleep(false));
 world.createCollider(R.ColliderDesc.cuboid(.28,.28,.8),intruder);
 for(let i=0;i<30;i++)world.step();
 const before=intruder.translation();
 fixed(9,8,.70,.6,.6,.55);
 for(let i=0;i<90;i++)world.step();
 const after=intruder.translation();
 const separation=Math.hypot(after.x-before.x,after.y-before.y,after.z-before.z);
 log('kontakt po dodaniu bryły do dynamicznego ciała',separation>.08,'ruch='+separation.toFixed(3)+'m (nie dowodzi poprawnej polityki edycji)');
 const bodyCount=world.bodies.len();
 log('krótkie wykonanie WebAssembly',true,'bodies='+bodyCount+', '+(performance.now()-t0).toFixed(0)+'ms z pobraniem modułu');

 // Kinematic character traverses the SAME inclined rigid ramp using a proper
 // capsule and engine contact controller; still not the final human feel.
 try{
  const player=world.createRigidBody(R.RigidBodyDesc.kinematicPositionBased().setTranslation(12,13,.78));
  const capsule=world.createCollider(R.ColliderDesc.capsule(.5,.28),player);
  const controller=world.createCharacterController(.02);
  controller.setMaxSlopeClimbAngle(Math.PI/3);
  controller.enableAutostep(.25,.06,true);
  controller.enableSnapToGround(.24);
  let blocked=0,peak=0,deckSamples=[],trace=[];
  for(let i=0;i<280;i++){
   controller.computeColliderMovement(capsule,{x:.065,y:0,z:-.055});
   const d=controller.computedMovement(),p=player.translation();
   if(d.x<.005)blocked++;
   player.setNextKinematicTranslation({x:p.x+d.x,y:p.y+d.y,z:p.z+d.z});
   world.step();
   peak=Math.max(peak,player.translation().z);const at=player.translation();if(at.x>=19&&at.x<=27)deckSamples.push(at.z);if(i%40===0)trace.push([i,at.x.toFixed(2),at.z.toFixed(2)]);
  }
  const final=player.translation();
  log('kontroler kapsuły: ziemia → rampa',final.x>16&&peak>1.7,
    'x='+final.x.toFixed(3)+', z='+final.z.toFixed(3)+', peak='+peak.toFixed(2)+', blocked='+blocked);
  log('kontroler: ciągłe przejście z rampy na podest',deckSamples.some(z=>z>3.0),'max-centre-on-deck='+Math.max(-1,...deckSamples).toFixed(2)+', samples='+trace.map(a=>a.join(':')).join(' | '));
  world.removeCharacterController(controller);
 }catch(err){log('kontroler kapsuły — nieukończona próba',false,String(err?.message||err))}
 lines.push('\nNIE TESTOWANO: joints, CCD, pełnego chwytu, edytora, mobile, fps ani feel.');

 output.textContent=lines.join('\n');output.dataset.state='done';
}catch(err){log('ŁADOWANIE / PRÓBA',false,String(err?.stack||err));output.dataset.state='error';}
</script></body></html>
